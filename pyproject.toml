[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govia-tracks"
version = "0.1.0"
description = "Offline association of disconnected aircraft tracklets (Govia assessment)."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "streamlit==1.67.0",
    "plotly==7.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
explore = ["pandas==3.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["data: reads the supplied data package (skipped if it is absent)"]
